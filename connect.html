<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تواصل معنا - كلية جمال عبدالناصر</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Tahoma, sans-serif;
      line-height: 1.9;
      color: #26352c;
      background-color: #f0f2ed;
    }

    header {
      background: linear-gradient(135deg, #173d2b, #496d4d);
      color: white;
      text-align: center;
      padding: 25px 15px;
      border-bottom: 5px solid #c6a85b;
    }

    header img {
      width: 250px;
      height: 250px;
      object-fit: contain;
      border-bottom: 20px solid red;
      border-radius: 50%;
      padding: 5px;
    }

    header h1 {
      margin: 10px 0 0;
      font-size: 30px;
    }

    header p {
      margin: 5px 0;
      color: #f4e6b8;
    }

    nav {
      background-color: #102d20;
      text-align: center;
      padding: 10px;
    }

    button {
      background-color: #245238;
      color: hwb(31 11% 14%);
      border: none;
      border-radius: 6px;
      padding: 10px 18px;
      margin: 4px;
      font-size: 18px;
      font-family: inherit;
      cursor: pointer;
    }


    button:hover {
      background-color: #c6a85b;
      color: #102d20;
    }

    section {
      max-width: 1000px;
      margin: 25px auto;
      padding: 25px;
      background-color: white;
      border-radius: 10px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
    }

    h2 {
      color: #245238;
      border-right: 5px solid #c6a85b;
      padding-right: 12px;
    }

    form {
      max-width: 600px;
      margin: auto;
    }

    label {
      display: block;
      margin-top: 12px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      margin-top: 5px;
      border: 1px solid #b8c5b5;
      border-radius: 6px;
      font-family: inherit;
      font-size: 16px;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    footer {
      background-color: #102d20;
      color: white;
      text-align: center;
      padding: 20px;
      margin-top: 30px;
    }

    @media (max-width: 600px) {
      section {
        margin: 15px 10px;
        padding: 18px;
      }
    }
  </style>
</head>

<body>
  <!-- رأس الصفحة وشعار الكلية -->
  <header id="home"> <img src="الأكاديمية العسكرية.png" alt="صورة أو شعار الكلية">
    <h1>كلية جمال عبدالناصر</h1>
    <input type="submit" value="   الـتـواصـل   ">
  </header>

  <nav>
    <button onclick="window.location.href='faculty.html'">الرئيسية</button>
    <button onclick="window.location.href='sections.html'">الأقسام</button>
    <button onclick="window.location.href='tables.html'">الجدول الدراسي</button>
    <button onclick="window.location.href='connect.html'">تواصل معنا</button>
  </nav>

  <section>
    <h2>تواصل معنا</h2>

    <p>يمكنك تعبئة النموذج التالي.</p>
    <form
      onsubmit="alert('تم ارسال رسالتك الى {كلية جمال عبدالناصر} سوف يتم التحقق من رسالتك ويتم ارسال رسالة الرد الى بريدك الالكتروني.'); return false;">
      <div>
        <label for="studentName">الاسم الكامل:</label>
        <input type="text" id="studentName" name="studentName" placeholder="اكتب اسمك الكامل" required>
      </div>
      <br>
      <div>
        <label for="studentEmail">البريد الإلكتروني:</label>
        <input type="email" id="studentEmail" name="studentEmail" placeholder="example@email.com" required>
      </div>
      <br>
      <div>
        <label for="message">الرسالة:</label>
        <textarea id="message" name="message" placeholder="اكتب رسالتك هنا" required></textarea>
        <button type="submit">ارسال الرسالة</button>
      </div>
    </form>
    <button onclick="window.location.href='faculty.html'">
      العودة إلى الرئيسية
    </button>
  </section>
  <footer>
    <p>كلية جمال عبدالناصر</p>
  </footer>

</body>

</html>
